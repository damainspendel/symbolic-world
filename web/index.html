<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Symbolic World — an atlas of Jung</title>
  </head>
  <body>
    <div id="cy"></div>

    <header id="topbar">
      <div class="brand">
        <span class="eyebrow">JungKG</span>
        <h1>The Symbolic World</h1>
      </div>
      <input id="search" type="search" placeholder="Search a symbol…" autocomplete="off" spellcheck="false" />
      <div id="stats"></div>
    </header>

    <aside id="filters">
      <div class="fgroup" id="filter-volume"></div>
      <div class="fgroup" id="filter-layer"></div>
      <button id="fit" title="Fit to screen">Fit</button>
      <button id="relayout" title="Re-run layout">Relayout</button>
    </aside>

    <section id="panel" class="hidden"></section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
