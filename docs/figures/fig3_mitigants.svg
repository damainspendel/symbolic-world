<svg viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="900" height="240" fill="#fbfaf7"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#6a7480"/></marker></defs>
<rect x="8" y="40" width="136" height="62" rx="9" fill="#eef2f6" stroke="#8898a8" stroke-width="1.4"/><text x="76" y="67" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">1 · PROPOSE</text><rect x="156" y="40" width="136" height="62" rx="9" fill="#e8f4ec" stroke="#5f9c78" stroke-width="1.4"/><text x="224" y="67" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">2 · QUOTE CHECK</text><text x="224" y="124" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">mitigates R2</text><rect x="304" y="40" width="136" height="62" rx="9" fill="#e8f4ec" stroke="#5f9c78" stroke-width="1.4"/><text x="372" y="67" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">3 · STRUCTURE GATE</text><text x="372" y="124" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">mitigates R1 + R3</text><rect x="452" y="40" width="136" height="62" rx="9" fill="#e8f4ec" stroke="#5f9c78" stroke-width="1.4"/><text x="520" y="67" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">4 · VOICE GATE</text><text x="520" y="124" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">mitigates R4</text><rect x="600" y="40" width="136" height="62" rx="9" fill="#e8f4ec" stroke="#5f9c78" stroke-width="1.4"/><text x="668" y="67" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">5 · SECOND VENDOR</text><text x="668" y="124" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">mitigates R6</text><rect x="748" y="40" width="136" height="62" rx="9" fill="#f6efdd" stroke="#c9a75a" stroke-width="1.4"/><text x="816" y="67" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">6 · PUBLISH</text><text x="816" y="124" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">readers backstop all</text><line x1="144" y1="71" x2="155" y2="71" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/><line x1="292" y1="71" x2="303" y2="71" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/><line x1="440" y1="71" x2="451" y2="71" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/><line x1="588" y1="71" x2="599" y2="71" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/><line x1="736" y1="71" x2="747" y2="71" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/>
<text x="450" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">Steps 2–5 did not exist in Figure 1: each was inserted because a named risk forced it.</text>
<text x="450" y="176" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">R5 (selection) is mitigated by union-mining + stability probing; R7 (refereeing) by publishing every</text>
<text x="450" y="192" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">ruling and having the second vendor adversarially re-review the referee. Humans get the last word at 6.</text>
<text x="450" y="222" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">Green = mitigant. The pipeline is not a design; it is a list of answers.</text>
</svg>