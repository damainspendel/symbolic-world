<svg viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="900" height="170" fill="#fbfaf7"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#6a7480"/></marker></defs>
<rect x="120" y="45" width="240" height="70" rx="9" fill="#eef2f6" stroke="#8898a8" stroke-width="1.4"/>
<text x="240" y="75" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#1a2430">PROPOSE</text><text x="240" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">an AI reads the volumes and drafts</text><text x="240" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">claims, each with quote and paragraph</text>
<rect x="540" y="45" width="240" height="70" rx="9" fill="#f6efdd" stroke="#c9a75a" stroke-width="1.4"/>
<text x="660" y="75" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#1a2430">PUBLISH</text><text x="660" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">an interactive atlas of the</text><text x="660" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">corpus, for a few cents a claim</text>
<line x1="360" y1="80" x2="538" y2="80" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/>
<text x="450" y="70" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">minutes per batch</text>
<text x="450" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">The opportunity — and, unguarded, the trap. This is what current tools do.</text>
</svg>