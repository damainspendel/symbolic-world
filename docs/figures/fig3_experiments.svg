<rect x="8" y="44" width="136" height="62" rx="9" fill="#eef2f6" stroke="#8898a8" stroke-width="1.4"/><text x="76" y="71" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">1 · PROPOSE</text><rect x="156" y="44" width="136" height="62" rx="9" fill="#e8f4ec" stroke="#5f9c78" stroke-width="1.4"/><text x="224" y="71" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">2 · QUOTE CHECK</text><text x="224" y="128" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">mitigates R2</text><rect x="304" y="44" width="136" height="62" rx="9" fill="#e8f4ec" stroke="#5f9c78" stroke-width="1.4"/><text x="372" y="71" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">3 · STRUCTURE GATE</text><text x="372" y="128" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">mitigates R1 + R3</text><rect x="452" y="44" width="136" height="62" rx="9" fill="#e8f4ec" stroke="#5f9c78" stroke-width="1.4"/><text x="520" y="71" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">4 · VOICE GATE</text><text x="520" y="128" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">mitigates R4</text><rect x="600" y="44" width="136" height="62" rx="9" fill="#e8f4ec" stroke="#5f9c78" stroke-width="1.4"/><text x="668" y="71" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">5 · SECOND VENDOR</text><text x="668" y="128" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">mitigates R6</text><rect x="748" y="44" width="136" height="62" rx="9" fill="#f6efdd" stroke="#c9a75a" stroke-width="1.4"/><text x="816" y="71" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" font-weight="bold" fill="#1a2430">6 · PUBLISH</text><text x="816" y="128" text-anchor="middle" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3f7c5c">readers backstop all</text><line x1="144" y1="75" x2="155" y2="75" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/><line x1="292" y1="75" x2="303" y2="75" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/><line x1="440" y1="75" x2="451" y2="75" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/><line x1="588" y1="75" x2="599" y2="75" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/><line x1="736" y1="75" x2="747" y2="75" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/>
<text x="12" y="152" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">E0</text><text x="74" y="152" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">re-check ungated output: how bad is raw extraction?</text><text x="12" y="169" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">E1b</text><text x="74" y="169" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">planted errors: what share does the structure gate catch?</text><text x="12" y="186" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">E2</text><text x="74" y="186" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">adversarial audit of published edges</text><text x="12" y="203" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">E3</text><text x="74" y="203" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">graph-wide sweep of the voice axis</text><text x="12" y="220" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">E4</text><text x="74" y="220" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">independent re-extraction: same core claims?</text><text x="462" y="152" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">E5</text><text x="524" y="152" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">planted voice errors: does the narrow specialist catch more?</text><text x="462" y="169" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">E6</text><text x="524" y="169" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">second vendor re-judges a sample under our rubric</text><text x="462" y="186" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">E7</text><text x="524" y="186" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">second vendor judges a full volume, reduced rubric</text><text x="462" y="203" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">canaries</text><text x="524" y="203" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">planted corruptions the validators must catch on every run</text><text x="462" y="220" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">humans</text><text x="524" y="220" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">reader confirmations & disputes, publicly logged</text><text x="12" y="237" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">E9</text><text x="74" y="237" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">held-out window: does a taught miner beat an untaught one?</text><text x="462" y="237" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#3d6a8c">E10</text><text x="524" y="237" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">a human hand-validates a stratified gold sample</text>
<text x="450" y="276" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">Chips = the experiment that measures that step; per-experiment details in Appendix A.</text>
