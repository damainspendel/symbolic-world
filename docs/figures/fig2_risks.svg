<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<rect width="900" height="330" fill="#fbfaf7"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#6a7480"/></marker></defs>
<rect x="120" y="35" width="240" height="70" rx="9" fill="#eef2f6" stroke="#8898a8" stroke-width="1.4"/>
<text x="240" y="65" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#1a2430">PROPOSE</text><text x="240" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">an AI reads and drafts claims</text>
<rect x="540" y="35" width="240" height="70" rx="9" fill="#f6efdd" stroke="#c9a75a" stroke-width="1.4"/>
<text x="660" y="65" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#1a2430">PUBLISH</text><text x="660" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">straight to readers</text>
<line x1="360" y1="70" x2="538" y2="70" stroke="#6a7480" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="240" y1="105" x2="240" y2="128" stroke="#b0483a" stroke-width="1.6"/>
<rect x="40" y="128" width="420" height="150" rx="9" fill="#faeeea" stroke="#c96a5a" stroke-width="1.4"/>
<text x="56" y="150" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#b0483a">RISKS OF READING — all arise here</text>
<text x="56" y="171" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">R1 · the statement is wrong or invented (~25% when unchecked)</text>
<text x="56" y="190" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">R2 · the supporting quote is fabricated</text>
<text x="56" y="209" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">R3 · the meaning is wrong — direction, object, &#8220;is&#8221; vs &#8220;is like&#8221;</text>
<text x="56" y="228" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">R4 · the context is wrong — whose voice is it, how firmly said</text>
<text x="56" y="247" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">R5 · the selection is arbitrary — why these claims and not others?</text>
<line x1="660" y1="105" x2="660" y2="128" stroke="#b0483a" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="500" y="128" width="360" height="110" rx="9" fill="#faeeea" stroke="#c96a5a" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="516" y="150" text-anchor="start" font-family="Menlo,monospace" font-size="10" font-weight="bold" fill="#b0483a">RISKS OF THE FIX ITSELF</text>
<text x="516" y="171" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">R6 · checker and writer share a vendor —</text>
<text x="516" y="186" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">shared blind spots nobody inside can see</text>
<text x="516" y="207" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">R7 · disagreements get refereed by</text>
<text x="516" y="222" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">one of our own models</text>
<text x="450" y="310" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#4a5560">Whatever machinery we add to fix R1–R5 creates R6–R7. Both kinds must be handled.</text>
</svg>